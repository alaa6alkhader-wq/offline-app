name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Package Desktop App
        run: |
          npx nativefier "." --name "MyOfflineApp" --platform windows --arch x64

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: MyOfflineApp-Windows
          path: MyOfflineApp-win32-x64
